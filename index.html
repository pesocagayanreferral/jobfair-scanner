<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Job Fair Check-In</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');

* { box-sizing: border-box; }

body {
  font-family: 'Inter', Arial, sans-serif;
  text-align: center;
  margin: 0;
  padding: 20px 16px;
  background: #111111;
  color: #f0f0f0;
}

/* ── Header Row ── */
#headerRow {
  display: flex;
  align-items: center;
  justify-content: space-between;
  width: 100%;
  max-width: 400px;
  margin: 0 auto 20px;
}

#pageTitle {
  margin: 0;
  font-size: 18px;
  font-weight: 600;
  letter-spacing: -0.02em;
  text-align: left;
}

#pageIndicator {
  font-size: 11px;
  color: #555555;
  text-transform: uppercase;
  letter-spacing: 0.1em;
  font-family: monospace;
}

/* ── Counter ── */
#counter {
  margin: 0 auto 20px;
  background: #1a1a1a;
  border: 1px solid #252525;
  border-radius: 14px;
  padding: 14px 12px;
  max-width: 400px;
  display: flex;
  justify-content: space-around;
  align-items: center;
}

#counter > div {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 3px;
}

#counter span.label {
  color: #666666;
  font-weight: 400;
  font-size: 11px;
  display: block;
  text-transform: uppercase;
  letter-spacing: 0.08em;
}

#checkedInCount {
  font-size: 28px;
  font-weight: 700;
  color: #2ea44f;
  letter-spacing: -0.02em;
  display: block;
  line-height: 1;
}

#hotsCount {
  font-size: 28px;
  font-weight: 700;
  color: #e6a817;
  letter-spacing: -0.02em;
  display: block;
  line-height: 1;
}

#counterDivider {
  width: 1px;
  height: 36px;
  background: #2a2a2a;
  flex-shrink: 0;
}

/* ── Buttons ── */
.scanBtn {
  font-family: 'Inter', Arial, sans-serif;
  font-size: 16px;
  font-weight: 600;
  padding: 16px 20px;
  margin: 6px auto;
  display: block;
  width: 100%;
  max-width: 400px;
  color: #ffffff;
  border: none;
  border-radius: 12px;
  cursor: pointer;
  letter-spacing: -0.01em;
  transition: filter 0.15s ease, transform 0.1s ease;
}

.scanBtn:hover  { filter: brightness(1.12); }
.scanBtn:active { transform: scale(0.98); }

#startBtn { background: #0b6efd; box-shadow: 0 4px 24px rgba(11, 110, 253, 0.25); }
#hotsBtn  { background: #d4820a; box-shadow: 0 4px 24px rgba(212, 130, 10, 0.22); }

/* ── Back Button (lives in header row) ── */
#backBtn {
  font-family: 'Inter', Arial, sans-serif;
  font-size: 14px;
  font-weight: 500;
  padding: 8px 16px;
  display: none;
  background: #222222;
  color: #aaaaaa;
  border: 1px solid #333333;
  border-radius: 10px;
  cursor: pointer;
  transition: background 0.15s ease, color 0.15s ease;
  margin: 0;
}

#backBtn:hover {
  background: #2a2a2a;
  color: #f0f0f0;
}

/* ── Mode Label ── */
#modeLabel {
  font-size: 12px;
  color: #aaaaaa;
  margin: 0 auto 12px;
  display: none;
  text-transform: uppercase;
  letter-spacing: 0.1em;
  font-weight: 500;
  max-width: 400px;
}

/* ── Reader ── */
#reader {
  width: 100%;
  max-width: 400px;
  margin: 0 auto 16px;
  border-radius: 18px;
  overflow: hidden;
  border: 1px solid #252525;
}

/* ── Result Card ── */
#result {
  margin: 0 auto;
  padding: 18px 24px;
  border-radius: 14px;
  font-size: 18px;
  font-weight: 700;
  min-height: 60px;
  display: none;
  border: 1px solid transparent;
  transition: background 0.25s ease, border-color 0.25s ease;
  letter-spacing: -0.01em;
  max-width: 400px;
  width: 100%;
}

.success   { background: #1e7e34; border-color: #2ea44f; color: #ffffff; }
.duplicate { background: #7a5000; border-color: #b8860b; color: #ffffff; }
.invalid   { background: #7a1020; border-color: #c0392b; color: #ffffff; }
.idle      { background: #1c1c1c; border-color: #333333; color: #aaaaaa; }

/* ── Error ── */
#errorMsg {
  color: #ff8080;
  margin: 10px auto 0;
  font-size: 13px;
  display: none;
  max-width: 400px;
}

/* ── Search + Registrant List ── */
#listSection {
  max-width: 400px;
  margin: 24px auto 0;
  text-align: left;
}

#listHeading {
  font-size: 12px;
  color: #666666;
  text-transform: uppercase;
  letter-spacing: 0.08em;
  font-weight: 500;
  margin: 0 0 8px 2px;
}

#searchInput {
  width: 100%;
  font-family: 'Inter', Arial, sans-serif;
  font-size: 15px;
  padding: 12px 14px;
  background: #1a1a1a;
  border: 1px solid #252525;
  border-radius: 12px;
  color: #f0f0f0;
  outline: none;
  margin-bottom: 10px;
  transition: border-color 0.15s ease;
}

#searchInput::placeholder { color: #555555; }
#searchInput:focus { border-color: #0b6efd; }

#registrantList {
  background: #1a1a1a;
  border: 1px solid #252525;
  border-radius: 14px;
  max-height: 320px;
  overflow-y: auto;
}

.registrantRow {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 12px 14px;
  border-bottom: 1px solid #232323;
  gap: 10px;
}

.registrantRow:last-child { border-bottom: none; }

.registrantName {
  font-size: 14px;
  font-weight: 600;
  color: #f0f0f0;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.registrantTime {
  font-size: 12px;
  color: #2ea44f;
  font-weight: 500;
  flex-shrink: 0;
}

.listEmpty {
  padding: 20px 14px;
  text-align: center;
  color: #555555;
  font-size: 13px;
}
</style>
</head>
<body>

  <!-- Header row: title/back on left, page indicator on right -->
  <div id="headerRow">
    <h2 id="pageTitle">Job Fair Check-In</h2>
    <button id="backBtn" onclick="stopScanner()">⬅ Back</button>
    <span id="pageIndicator">HOME</span>
  </div>

  <div id="counter">
    <div><span id="checkedInCount">0</span><span class="label">Checked In</span></div>
    <div id="counterDivider"></div>
    <div><span id="hotsCount">0</span><span class="label">HOTS</span></div>
  </div>

  <button id="startBtn" class="scanBtn" onclick="startScanner('checkin')">📷 Scan to Register Jobseeker</button>
  <button id="hotsBtn"  class="scanBtn" onclick="startScanner('hots')">⭐ Scan to Record HOTS</button>

  <div id="modeLabel"></div>
  <div id="reader"></div>
  <div id="result" class="idle">Point camera at QR code</div>
  <div id="errorMsg"></div>

  <!-- Search + registrant list (menu view only) -->
  <div id="listSection">
    <div id="listHeading">Checked-In Registrants</div>
    <input id="searchInput" type="search" placeholder="Search by name..." autocomplete="off" oninput="filterList()">
    <div id="registrantList">
      <div class="listEmpty">Loading...</div>
    </div>
  </div>

  <script src="https://unpkg.com/html5-qrcode"></script>
  <script>
    const APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbxYrQIvCGjfHPJXxr1ctM1e4CGskuxPUhAyCZ4Ot2SDoCkygP_DAXYaHuxi8q9yJCcl/exec';

    let isProcessing = false;
    let html5QrCode;
    let currentMode = null;
    let jsonpCounter = 0;
    let allCheckedIn = []; // cached list, filtered client-side as the person types

    const resultDiv      = document.getElementById('result');
    const errorDiv        = document.getElementById('errorMsg');
    const startBtn        = document.getElementById('startBtn');
    const hotsBtn          = document.getElementById('hotsBtn');
    const backBtn          = document.getElementById('backBtn');
    const modeLabel        = document.getElementById('modeLabel');
    const pageTitle        = document.getElementById('pageTitle');
    const pageIndicator    = document.getElementById('pageIndicator');
    const counterDivider   = document.getElementById('counterDivider');
    const listSection      = document.getElementById('listSection');
    const registrantList   = document.getElementById('registrantList');
    const searchInput      = document.getElementById('searchInput');

    function jsonpGet(params, onDone) {
      const callbackName = 'jsonpCallback_' + (jsonpCounter++);
      const script = document.createElement('script');
      window[callbackName] = function(data) { onDone(data); delete window[callbackName]; script.remove(); };
      script.onerror = function() { onDone({ status: 'error', message: 'Network error' }); delete window[callbackName]; script.remove(); };
      const query = Object.keys(params).map(k => k + '=' + encodeURIComponent(params[k])).join('&');
      script.src = APPS_SCRIPT_URL + '?' + query + '&callback=' + callbackName;
      document.body.appendChild(script);
    }

    function refreshStats() {
      jsonpGet({ action: 'stats' }, (data) => {
        if (data.status === 'success') {
          document.getElementById('checkedInCount').textContent = data.checkedIn;
          document.getElementById('hotsCount').textContent = data.hots;
        }
      });
    }

    // ---- Registrant list + live search ----
    function refreshList() {
      jsonpGet({ action: 'list' }, (data) => {
        if (data.status === 'success') {
          allCheckedIn = data.list;
          renderList(allCheckedIn);
        }
      });
    }

    function renderList(items) {
      if (!items.length) {
        registrantList.innerHTML = '<div class="listEmpty">No registrants found</div>';
        return;
      }
      registrantList.innerHTML = items.map(item =>
        '<div class="registrantRow">' +
          '<span class="registrantName">' + escapeHtml(item.name) + '</span>' +
          '<span class="registrantTime">' + escapeHtml(item.time) + '</span>' +
        '</div>'
      ).join('');
    }

    function filterList() {
      const term = searchInput.value.trim().toLowerCase();
      if (!term) { renderList(allCheckedIn); return; }
      const filtered = allCheckedIn.filter(item => item.name.toLowerCase().includes(term));
      renderList(filtered);
    }

    function escapeHtml(str) {
      const div = document.createElement('div');
      div.textContent = str || '';
      return div.innerHTML;
    }

    refreshStats();
    refreshList();

    function startScanner(mode) {
      currentMode = mode;
      errorDiv.style.display = 'none';
      startBtn.style.display = 'none';
      hotsBtn.style.display  = 'none';
      listSection.style.display = 'none'; // hide search/list while actively scanning

      // Header
      pageTitle.style.display    = 'none';
      backBtn.style.display      = 'inline-block';
      pageIndicator.textContent  = mode === 'hots' ? 'HOTS' : 'CHECK-IN';

      // Counter — show only the relevant stat
      document.getElementById('checkedInCount').closest('div').style.display = mode === 'checkin' ? 'flex' : 'none';
      document.getElementById('hotsCount').closest('div').style.display      = mode === 'hots'    ? 'flex' : 'none';
      counterDivider.style.display = 'none';

      // Mode label with matching color
      modeLabel.style.display = 'block';
      modeLabel.textContent   = mode === 'hots' ? '⭐ Recording HOTS' : '📷 Registering Jobseeker';
      modeLabel.style.color   = mode === 'hots' ? '#d4820a' : '#0b6efd';

      html5QrCode = new Html5Qrcode("reader");
      html5QrCode.start(
        { facingMode: "environment" },
        { fps: 10, qrbox: 250 },
        onScanSuccess
      ).then(() => {
        resultDiv.style.display = 'block';
      }).catch(() => {
        Html5Qrcode.getCameras().then(devices => {
          if (devices && devices.length) {
            const backCam = devices.find(d => /back|rear|environment/i.test(d.label)) || devices[devices.length - 1];
            html5QrCode.start(backCam.id, { fps: 10, qrbox: 250 }, onScanSuccess)
              .then(() => { resultDiv.style.display = 'block'; })
              .catch(err2 => showError(err2));
          } else {
            showError('No camera found on this device.');
          }
        }).catch(err3 => showError(err3));
      });
    }

    function stopScanner() {
      if (html5QrCode) {
        html5QrCode.stop().then(() => { html5QrCode.clear(); resetToMenu(); }).catch(() => resetToMenu());
      } else {
        resetToMenu();
      }
    }

    function resetToMenu() {
      startBtn.style.display  = 'block';
      hotsBtn.style.display   = 'block';
      backBtn.style.display   = 'none';
      resultDiv.style.display = 'none';
      modeLabel.style.display = 'none';
      listSection.style.display = 'block';
      currentMode = null;

      // Restore header
      pageTitle.style.display   = 'block';
      pageIndicator.textContent = 'HOME';

      // Restore both counter stats
      document.getElementById('checkedInCount').closest('div').style.display = 'flex';
      document.getElementById('hotsCount').closest('div').style.display      = 'flex';
      counterDivider.style.display = 'block';

      refreshList(); // pick up anything scanned while away from the menu
    }

    function showError(err) {
      errorDiv.style.display  = 'block';
      errorDiv.textContent    = 'Camera error: ' + (err.message || err) + '. Make sure you tapped "Allow" on the camera prompt.';
      resetToMenu();
    }

    function onScanSuccess(decodedText) {
      if (isProcessing) return;
      isProcessing = true;
      resultDiv.className  = 'idle';
      resultDiv.textContent = 'Checking...';
      const action = currentMode === 'hots' ? 'hots' : 'checkin';
      jsonpGet({ action: action, id: decodedText }, (res) => { handleResult(res); refreshStats(); });
    }

    function handleResult(res) {
      if (res.status === 'success') {
        if (navigator.vibrate) navigator.vibrate(200);
        resultDiv.className = 'success';
        resultDiv.innerHTML = '✅<br>' + res.name + '<br><span style="font-size:15px">' + (currentMode === 'hots' ? 'Registered HOTS' : 'Checked In') + ' — ' + res.time + '</span>';
      } else if (res.status === 'duplicate') {
        if (navigator.vibrate) navigator.vibrate([100, 100, 100]);
        resultDiv.className = 'duplicate';
        resultDiv.innerHTML = '⚠️<br>' + res.name + '<br><span style="font-size:15px">Already recorded — ' + res.time + '</span>';
      } else if (res.status === 'not_checked_in') {
        if (navigator.vibrate) navigator.vibrate([150, 100, 150, 100, 150]);
        resultDiv.className = 'invalid';
        resultDiv.innerHTML = '🚫<br>' + res.name + '<br><span style="font-size:15px">Not checked in yet — send to Check-In first</span>';
      } else if (res.status === 'error') {
        if (navigator.vibrate) navigator.vibrate(500);
        resultDiv.className = 'invalid';
        resultDiv.innerHTML = '⚠️ System Error<br><span style="font-size:14px">' + res.message + '</span>';
      } else {
        if (navigator.vibrate) navigator.vibrate(500);
        resultDiv.className = 'invalid';
        resultDiv.innerHTML = '❌<br>Invalid Ticket';
      }
      setTimeout(() => {
        isProcessing = false;
        resultDiv.className  = 'idle';
        resultDiv.textContent = 'Point camera at QR code';
      }, 2500);
    }
  </script>
</body>
</html>
